# ============================================================
# AI Quality Platform — Runtime Configuration
# All thresholds live here. Never hardcode in Python or C++.
# Claude can tune this file without touching source code.
# ============================================================

camera:
  device_id: 0
  width: 1280
  height: 800
  fps: 30

detectors:
  surface:
    canny_low: 50
    canny_high: 150
    min_defect_area_px: 8
    score_threshold: 0.3
  color:
    hsv_lower: [0, 0, 0]
    hsv_upper: [180, 50, 80]
    anomaly_threshold: 0.05
  brightness:
    mean_min: 40
    mean_max: 220
    std_max: 70

decision:
  pass_threshold: 0.7    # >= 0.7 = PASS
  warn_threshold: 0.5    # 0.5–0.69 = WARN
  weights:
    surface: 0.5
    color: 0.3
    brightness: 0.2

analytics:
  pre_erp_window_minutes: 30
  pre_erp_fail_threshold: 0.15   # 15% fail rate triggers alert

database:
  url: "sqlite:///./quality.db"   # swap to postgresql:// for production

api:
  host: "0.0.0.0"
  port: 8000

erp:
  webhook_url: "http://localhost:9000/quality-event"
  enabled: false
